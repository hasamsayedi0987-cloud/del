name: build-desktop

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  desktop:
    strategy:
      matrix:
        include:
          - os: windows-latest
            args: "--win nsis --x64"
            artifact: Del-*-windows-x64-setup.exe
          - os: macos-latest
            args: "--mac dmg --arm64"
            artifact: Del-*-macos-arm64.dmg
          - os: ubuntu-latest
            args: "--linux AppImage --x64"
            artifact: Del-*-linux-x86_64.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate

      - name: Build web core
        run: |
          pnpm install --filter @del/web-core...
          pnpm --filter @del/web-core build

      - name: Assemble desktop package
        run: |
          pnpm install --filter @del/desktop...
          cd apps/desktop
          mkdir -p www && cp -r ../web-core/dist/* www/
          pnpm build
          npx electron-builder ${{ matrix.args }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: del-desktop-${{ matrix.os }}
          path: apps/desktop/release/*
          if-no-files-found: ignore

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Package Del server
        run: |
          cd apps/api
          npm install --omit=dev
          npm run build
          mkdir -p bundle
          cp dist/server.js bundle/
          cp -r node_modules bundle/node_modules
          cp package.json bundle/
          cd bundle && zip -r ../../../../del-server.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: del-server
          path: del-server.zip
