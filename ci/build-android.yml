name: build-android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["apps/mobile/**", "apps/web-core/**", ".github/workflows/build-android.yml"]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate

      - name: Build web core
        run: |
          pnpm install --filter @del/web-core...
          pnpm --filter @del/web-core build

      - name: Prepare Capacitor Android project
        run: |
          pnpm install --filter @del/mobile...
          cd apps/mobile
          mkdir -p www && cp -r ../web-core/dist/* www/
          npx cap sync android

      - name: Build release APK (debug-signed for testing)
        run: |
          cd apps/mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Del-android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
