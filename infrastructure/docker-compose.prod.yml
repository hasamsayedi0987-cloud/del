# ============================================================
# Del — استقرار پروداکشن (تک‌سرور)
# Usage از ریشه مخزن:
#   cp .env.example .env   و مقادیر واقعی را وارد کنید
#   docker compose -f infrastructure/docker-compose.prod.yml up -d --build
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-del_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?must set}
      POSTGRES_DB: ${POSTGRES_DB:-del}
    volumes:
      - del_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-del_user} -d ${POSTGRES_DB:-del}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - del_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-del_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-del}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?must set}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?must set}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-900}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-2592000}
      # ⚠️ در پروداکشن حتماً false — بعد از اتصال سرویس SMS (گام ۲)
      AUTH_DEV_MODE: ${AUTH_DEV_MODE:-false}
      # ————— رسانه (گام ۵) —————
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-del-media}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-del_minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?must set}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      MEDIA_SIGNED_URL_TTL_SEC: ${MEDIA_SIGNED_URL_TTL_SEC:-300}
      # ————— تماس‌ها (گام ۶) — LiveKit —————
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://livekit:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecret-0123456789abcdef0123456789abcdef}
    ports:
      - "${API_PORT:-3000}:3000"

  # SFU تماس‌های صوتی/تصویری (گام ۶)
  # برای انتشار عمومی: دامنه + TLS (wss) و coturn برای کلاینت‌های پشت NAT سخت — docs/08-operations.md
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: ["--dev", "--bind", "0.0.0.0"]  # پروداکشن: فایل config کامل با turn — docs/08-operations.md
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecret-0123456789abcdef0123456789abcdef}"
    ports:
      - "7880:7880"        # WebSocket signaling (در پروداکشن پشت reverse proxy با wss)
      - "7881:7881"        # TCP fallback مدیا
      - "7882:7882/udp"    # RTC over UDP

  # ذخیره‌سازی رسانه (گام ۵) — bucket با سرویس minio-init ساخته می‌شود
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-del_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?must set}
    volumes:
      - del_miniodata:/data

  # ساخت خودکار bucket رسانه
  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-del_minio} $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/${S3_BUCKET:-del-media} &&
      echo 'media bucket ready'"
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?must set}

volumes:
  del_pgdata:
  del_redisdata:
  del_miniodata:
