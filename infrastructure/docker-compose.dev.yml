# محیط توسعه محلی دل — postgres + redis + minio + livekit
# Usage: docker compose -f infrastructure/docker-compose.dev.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: del-postgres
    environment:
      POSTGRES_USER: del_user
      POSTGRES_PASSWORD: del_dev_password   # فقط برای توسعه محلی
      POSTGRES_DB: del
    ports:
      - "5432:5432"
    volumes:
      - del_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U del_user -d del"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: del-redis
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6379:6379"
    volumes:
      - del_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: del-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: del_minio
      MINIO_ROOT_PASSWORD: del_dev_minio_password   # فقط برای توسعه محلی
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - del_miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ساخت خودکار bucket پیش‌فرض
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 del_minio del_dev_minio_password &&
      mc mb --ignore-existing local/del-media &&
      echo 'bucket del-media ready'"

  # سرور SFU تماس‌های صوتی/تصویری (گام ۶) — حالت dev با کلید ثابت
  # API با این مقادیر بوت شود: LIVEKIT_URL=ws://localhost:7880 LIVEKIT_API_KEY=devkey LIVEKIT_API_SECRET=devsecret-0123456789abcdef0123456789abcdef
  livekit:
    image: livekit/livekit-server:latest
    container_name: del-livekit
    command: ["--dev", "--bind", "0.0.0.0"]
    environment:
      LIVEKIT_KEYS: "devkey: devsecret-0123456789abcdef0123456789abcdef"
    ports:
      - "7880:7880"      # WebSocket signaling
      - "7881:7881"      # TCP fallback مدیا
      - "7882:7882/udp"  # RTC over UDP

volumes:
  del_pgdata:
  del_redisdata:
  del_miniodata:
