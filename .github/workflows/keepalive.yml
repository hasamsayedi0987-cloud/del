name: keep-api-warm
# Render Free بعد از ۱۵ دقیقه بی‌ترافیکی خاموش می‌شود؛ این workflow هر ۱۰ دقیقه
# به /health پینگ می‌دهد تا سرور همیشه بیدار بماند (نیازی به کامپیوتر روشن نیست).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: keepalive
  cancel-in-progress: false
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Del API
        run: |
          URL="${{ vars.DEL_API_URL }}"
          if [ -z "$URL" ]; then URL="https://del-messenger-api.onrender.com"; fi
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "$URL/api/v1/health" || true)
          echo "GET $URL/api/v1/health → $code"
          # هر پاسخی (حتی سردشدن اولیه) کافی است؛ فقط نباید شبکه قطع باشد
