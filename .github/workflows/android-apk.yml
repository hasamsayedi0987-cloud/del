# ساخت خودکار نصب‌پذیر اندروید (APK) — خروجی در تب Artifacts این اکشن
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "apps/api/**"
      - "packages/**"

jobs:
  apk:
    name: Build release APK (sideload-ready)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # نسخهٔ pnpm از packageManager در package.json خوانده می‌شود — پینِ جداگانه خطای تعارض می‌دهد
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # پکیج‌های workspace باید dist بسازند؛ metro هنگام bundle به main=dist/index.js
      # اشاره می‌کند و بدون این مرحله createBundleReleaseJsAndAssets مردود می‌شود
      - name: Build workspace packages (@del/e2ee, @del/shared-types)
        run: pnpm --filter @del/e2ee --filter @del/shared-types build

      - name: Generate native Android project (expo prebuild)
        run: pnpm --filter @del/mobile exec expo prebuild -p android --no-install

      # prebuild پروژهٔ android را از نو تولید می‌کند؛ بدون این مرحله keystore تصادفی و
      # ABIهای اضافی می‌گیریم — امضای پایدار شرط نصب به‌روزشده روی نسخهٔ نصب‌شدهٔ کاربر است
      - name: Restore stable signing + v1.4 build profile
        run: |
          cp apps/mobile/keystores/debug.keystore apps/mobile/android/app/debug.keystore
          sed -i 's/^newArchEnabled=.*/newArchEnabled=false/' apps/mobile/android/gradle.properties
          if grep -q '^reactNativeArchitectures=' apps/mobile/android/gradle.properties; then
            sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' apps/mobile/android/gradle.properties
          else
            echo 'reactNativeArchitectures=arm64-v8a' >> apps/mobile/android/gradle.properties
          fi
          grep -E 'newArchEnabled|reactNativeArchitectures' apps/mobile/android/gradle.properties

      # نسخهٔ release فایل JS (index.android.bundle) را داخل APK embed می‌کند؛
      # debug بدون Metro اجرا نمی‌شود و روی گوشی کاربر «Unable to load script» می‌دهد
      - name: Build release APK
        run: |
          cd apps/mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # دروازهٔ کیفیت: اگر bundle جاوااسکریپت داخل APK نبود، ساخت را مردود کن
      - name: Sanity check — JS bundle must be embedded
        run: |
          APK=$(ls apps/mobile/android/app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          unzip -l "$APK" | grep -q "assets/index.android.bundle" || { echo "MISSING index.android.bundle"; exit 1; }
          unzip -l "$APK" | grep "index.android.bundle"
          BT=$(ls -d ${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/*/ | sort -V | tail -1)
          "${BT}apksigner" verify --print-certs "$APK" | grep -i "SHA-256" || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Del-android-release
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
